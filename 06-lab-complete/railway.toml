# Railway (tiêu chí 12) — chạy `railway up` trong thư mục 06-lab-complete/
# Biến AGENT_API_KEY, REDIS_URL đặt trong Railway Variables, không ghi ở đây.
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
