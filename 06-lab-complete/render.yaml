# Render Blueprint (tiêu chí 12) — thay thế cho railway.toml
# File nằm trong 06-lab-complete/ nên đường dẫn Docker tính từ gốc repo.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    dockerContext: ./06-lab-complete
    dockerfilePath: ./06-lab-complete/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false                 # secret: nhập tay trên dashboard, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:                # lấy connection string của Redis bên dưới
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue                  # Redis-compatible (Render Key Value)
    name: day14-redis
    plan: free
    ipAllowList: []                 # chỉ cho service nội bộ trong Render truy cập
